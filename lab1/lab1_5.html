<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица животных</title>
</head>
<body>
    Количество строк: <input type="number" id="rowsCount">
    <button onclick="drawAnimals()">Рисовать</button>

    <script>
        function drawAnimals() {
            const rows = parseInt(document.getElementById('rowsCount').value);
            const pattern = ["dog", "dog", "dog", "cat", "cat"];
            let animalCounter = 0;

            for (let i = 0; i < rows; i++) {
                let rowOutput = "";
                for (let j = 0; j < 6; j++) {
                    rowOutput += pattern[animalCounter % pattern.length] + "\t";
                    animalCounter++;
                }
                console.log(rowOutput);
            }
        }
    </script>
</body>
</html>
