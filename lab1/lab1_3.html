<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод числа</title>
</head>
<body>
    <a href="index.html" id="numberLink">Получить число</a>

    <script>
        document.getElementById('numberLink').onclick = function(e) {
            let input;
            let success = false;

            while (true) {
                input = prompt("Введите число больше 100", "");
                
                if (input === null) {
                    // Нажали Cancel
                    success = false;
                    break;
                }
                
                if (Number(input) > 100) {
                    success = true;
                    break;
                }
            }

            if (success) {
                // Переход по ссылке разрешен
                return true; 
            } else {
                // Если нажали Cancel, спрашиваем подтверждение
                if (!confirm("Вы не ввели нужное число. Все равно перейти?")) {
                    e.preventDefault(); // Остаемся на странице
                }
            }
        };
    </script>
</body>
</html>
