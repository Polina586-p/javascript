<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пенсионный калькулятор</title>
</head>
<body>
    <form id="pensionForm">
        Возраст: <input type="number" id="age" required min="0">

        Пол: 
        <input type="radio" name="gender" value="male" required> Мужской
        <input type="radio" name="gender" value="female"> Женский

        <button type="submit">Рассчитать</button>

        <textarea id="result" cols="40" rows="5" readonly></textarea>
    </form>

    <script>
        let form = document.forms.pensionForm;
        let ageElems=form.elements.age;
        alert(ageElems.value);
        let genderElems=form.elements.gender;
        alert(genderElems[0]);
    </script>

</body>
</html>
